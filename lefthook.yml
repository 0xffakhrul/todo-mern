pre-commit:
  parallel: true
  commands:
    biome:
      root: "server/"
      glob: "*.{ts,js,json}"
      run: npx biome check --write --no-errors-on-unmatched {staged_files}
      stage_fixed: true
    gitleaks:
      run: gitleaks git --staged --redact --no-banner

pre-push:
  parallel: false
  commands:
    typecheck:
      root: "server/"
      run: npm run typecheck
    test:
      root: "server/"
      run: npm test
